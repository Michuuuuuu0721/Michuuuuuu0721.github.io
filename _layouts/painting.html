<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- title -->
    <title>{{ page.title }}</title>
    <style>
        body {
            margin: 0; 
            background-color: black !important; 
            color: white !important;
            font-family: sans-serif; 
            height: 100vh;
            display: flex; 
            flex-direction: column;
            justify-content: center; 
            align-items: center; 
            padding: 20px;
            box-sizing: border-box;
        }
        .art-container { 
            max-width: 90%; 
            max-height: 70vh; 
            text-align: center; 
        }
        .art-container img { 
            max-width: 100%; 
            max-height: 70vh; 
            object-fit: contain; 
        }
        .info-box { 
            margin-top: 20px; 
            text-align: center; 
            max-width: 600px; 
        }
        .title { 
            font-size: 20px; 
            margin-bottom: 10px; 
            letter-spacing: 1px; 
        }
        .desc { 
            font-size: 14px; 
            color: #888; 
            line-height: 1.6; 
        }
        .meta-info {
            font-size: 12px;
            color: #555;
            margin-top: 5px;
        }
        .back-btn { 
            margin-top: 30px; 
            color: #444; 
            text-decoration: none; 
            font-size: 13px; 
            transition: color 0.3s;
        }
        .back-btn:hover { 
            color: white; 
        }
    </style>
</head>
<body>

    <div class="art-container">
        <!-- image path -->
        <img src="{{ page.image_high }}" alt="{{ page.title }}" loading="eager" decoding="async">
    </div>
    
    <div class="info-box">
        <div class="title">{{ page.title }}</div>
        <div class="desc">{{ page.description }}</div>
        
        <!-- date / info -->
        {% if page.date_created or page.medium %}
        <div class="meta-info">
            {% if page.date_created %}{{ page.date_created }}{% endif %}
            {% if page.date_created and page.medium %} • {% endif %}
            {% if page.medium %}{{ page.medium }}{% endif %}
        </div>
        {% endif %}
    </div>
    
    <!-- content anchor -->
    {{ content }}

    <a href="/gallery/" class="back-btn">← Back to Gallery</a>

</body>
</html>
