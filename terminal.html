<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Terminal Core</title>
    <style>
        /* init */
        html, body {
            margin: 0 !important;
            padding: 0 !important;
            background-color: black !important;
            color: #FFFFFF !important;
            width: 100% !important;
            height: 100vh !important;
            overflow: hidden !important;
            font-family: 'Courier New', Courier, monospace;
            box-sizing: border-box;
        }

        /* layout */
        .terminal-wrapper {
            width: 100%;
            height: 100%;
            padding: 20px;
            box-sizing: border-box;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }

        .output-history {
            white-space: pre-wrap;
            line-height: 1.5;
            font-size: 14px;
        }

        .input-line {
            display: flex;
            align-items: center;
            margin-top: 5px;
            font-size: 14px;
        }

        .prompt {
            margin-right: 10px;
            user-select: none;
        }

        /* cmd input */
        .cmd-field {
            background: transparent;
            border: none;
            color: #FFFFFF;
            font-family: inherit;
            font-size: inherit;
            outline: none;
            flex: 1;
            padding: 0;
        }

        .terminal-wrapper::-webkit-scrollbar {
            width: 0px;
            background: transparent;
        }
    </style>
</head>
<body>

    <div class="terminal-wrapper" id="terminal-screen">
        <div class="output-history" id="history-box">CORE ARCHITECTURE [VERSION 1.0.1]
(C) 2026 MICHU. ALL RIGHTS RESERVED.

Type 'help' to view available commands.

</div>

        <div class="input-line">
            <span class="prompt">guest@michu:~#</span>
            <input type="text" class="cmd-field" id="user-input" autofocus autocomplete="off" spellcheck="false">
        </div>
    </div>

    <script>
        const inputField = document.getElementById('user-input');
        const historyBox = document.getElementById('history-box');
        const screenBox = document.getElementById('terminal-screen');

        const helpText = `Available commands:
  cd [dir]    Dynamic routing jump to any valid page suffix / permalink
  clear       Clear the terminal screen
  help        Display this information map`;

        /* focus guard */
        document.addEventListener('click', () => {
            inputField.focus();
        });

        /* trigger handler */
        inputField.addEventListener('keydown', function(event) {
            if (event.key === 'Enter') {
                const rawInput = this.value;
                const cleanInput = rawInput.trim();
                
                printLine(`guest@michu:~# ${rawInput}`);

                if (cleanInput.length > 0) {
                    executeCommand(cleanInput);
                }

                this.value = '';
                screenBox.scrollTop = screenBox.scrollHeight;
            }
        });

        function printLine(text) {
            historyBox.textContent += text + '\n';
            screenBox.scrollTop = screenBox.scrollHeight;
        }

        /* core runtime machine */
        function executeCommand(cmdStr) {
            const parts = cmdStr.split(/\s+/);
            const cmd = parts[0].toLowerCase();
            const arg = parts[1];

            switch (cmd) {
                case 'help':
                    printLine(helpText);
                    break;

                case 'clear':
                    historyBox.textContent = '';
                    break;

                case 'cd':
                    if (!arg || arg === '~' || arg === '/') {
                        printLine('Returned to baseline root directory: /');
                    } else {
                        /* format target suffix path pathing */
                        let target = arg.trim();
                        if (!target.startsWith('/')) target = '/' + target;
                        if (!target.endsWith('/')) target = target + '/';

                        printLine(`Probing destination node: ${target} ...`);
                        
                        /* block input while mapping */
                        inputField.disabled = true;

                        /* 💡 dynamic gateway check: fetch head pointer to verify path existence */
                        fetch(target, { method: 'HEAD' })
                        .then((response) => {
                            inputField.disabled = false;
                            inputField.focus();

                            if (response.ok) {
                                /* 200 OK - routing confirmed */
                                printLine(`Routing handshake established. Syncing...`);
                                setTimeout(() => {
                                    window.location.href = target;
                                }, 400);
                            } else {
                                /* 404 or other errors - routing rejected */
                                printLine(`cd: ${arg}: Suffix destination or permalink not found`);
                            }
                        })
                        .catch((error) => {
                            /* network edge case */
                            inputField.disabled = false;
                            inputField.focus();
                            printLine(`cd: connection handshake timeout on route: ${arg}`);
                        });
                    }
                    break;

                default:
                    printLine(`core: command not found: ${cmd}. Type 'help' for map.`);
                    break;
            }
        }
    </script>

</body>
</html>
