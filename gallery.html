<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery</title>
    <style>
        body {
            margin: 0; padding: 40px 20px;
            background-color: black; font-family: sans-serif;
        }
        
        /* 1. 马赛克瀑布流网格基础布局 */
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            grid-auto-rows: 200px;
            grid-gap: 20px;
            max-width: 1200px; margin: 0 auto;
        }
        
        /* 2. 单个画作单元格子 */
        .gallery-item {
            position: relative; 
            overflow: hidden; 
            border-radius: 4px;
            background-color: #050505;
        }
        .gallery-item:nth-child(3n+1) { grid-row: span 2; }
        .gallery-item:nth-child(4n+2) { grid-row: span 1.5; } 
        .gallery-item a { display: block; width: 100%; height: 100%; }

        /* ======================================================== */
        /* 🎨 纯 CSS 降采样：双图层平滑淡出技术 (完美修复重叠问题) */
        /* ======================================================== */
        
        /* 基础底层：两层图层全部继承容器大小 */
        .img-layer {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%; object-fit: cover;
            transform-origin: center center;
            /* 💡 默认状态下：两层图片都处于你喜欢的 1.08 倍膨胀状态 */
            transform: scale(1.08); 
            transition: transform 0.5s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.5s ease;
            will-change: transform, opacity;
        }

        /* 👑 图层 A (在上层)：渲染纯净、不重叠、无错位的 8×8 级硬边大像素方块 */
        .pixelated-layer {
            z-index: 2;
            opacity: 0.8; /* 默认轻微暗淡，更符合黑暗美学 */
            
            /* 🛠️ 像素化核心核心：无视设备分辨率，锁死网格硬边 */
            image-rendering: -moz-crisp-edges;
            image-rendering: -o-crisp-edges;
            image-rendering: -webkit-optimize-contrast;
            image-rendering: crisp-edges;
            image-rendering: pixelated; /* */

            /* 🛠️ 降采样黑魔法：
               第一步：width/height 强行撑到 1000% (拉伸10倍) 
               第二步：transform 缩小至 0.1倍 并叠加上原本的 1.08倍 = scale(0.108) 
               这样会逼迫浏览器把 7.1MB 的图瞬间压缩成只有几个像素点的纯色网格！*/
            width: 1000% !important;
            height: 1000% !important;
            transform: scale(0.108); 
        }

        /* 👑 图层 B (在下层)：静静隐藏，保留你珍贵的 7.1MB 原始极致超清无损细节 */
        .hd-layer {
            z-index: 1;
            opacity: 0; /* 默认隐藏，等待马赛克褪去 */
            image-rendering: auto; /* 恢复高质量平滑渲染 */
        }

        /* ======================================================== */
        /* 🚀 鼠标悬停 (Hover) 的双层联动淡出收缩特效 */
        /* ======================================================== */
        
        /* 1. 当鼠标移上去时：两层图片立刻完美同步向内收缩回 1.0 尺寸 */
        .gallery-item:hover .img-layer {
            transform: scale(1.0); 
        }

        /* 2. 核心：上层的巨型马赛克色块在 0.5 秒内慢慢变透明，丝滑淡出 */
        .gallery-item:hover .pixelated-layer {
            opacity: 0; 
        }

        /* 3. 核心：下层的 7.1MB 原始超清原画同步平滑淡入，完全浮现 */
        .gallery-item:hover .hd-layer {
            opacity: 1; 
        }

        /* 覆盖在图片上的文本标题 */
        .item-overlay {
            position: absolute; bottom: 0; left: 0; right: 0; z-index: 3;
            padding: 20px; background: linear-gradient(transparent, rgba(0,0,0,0.8));
            opacity: 0; transition: opacity 0.4s; pointer-events: none;
        }
        .gallery-item:hover .item-overlay { opacity: 1; }
        .item-title { color: white; font-size: 14px; margin-bottom: 4px; }
    </style>
</head>
<body>

    <!-- 💡 注意：这里已经彻底删掉了所有复杂的 SVG 滤镜代码，干净纯粹！ -->

    <div class="gallery-grid">
        {% for painting in site.paintings %}
        <div class="gallery-item">
            <a href="{{ painting.url }}">
                
                <!-- 👑 图层 A：马赛克外套层（这里我们通过 CSS 的宽高和小缩放实现了无缝的大方块网格） -->
                <img src="{{ painting.image_high }}" class="img-layer pixelated-layer" alt="{{ painting.title }}">
                
                <!-- 👑 图层 B：高清真身层（用户碰触时平滑淡入呈现） -->
                <img src="{{ painting.image_high }}" class="img-layer hd-layer" alt="{{ painting.title }}" loading="lazy">
                
                <div class="item-overlay">
                    <div class="item-title">{{ painting.title }}</div>
                </div>
            </a>
        </div>
        {% endfor %}
    </div>

</body>
</html>
