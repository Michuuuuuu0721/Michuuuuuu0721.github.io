<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery</title>
    <style>
        body {
            margin: 0; padding: 40px 20px;
            background-color: black; font-family: sans-serif;
        }
        
        /* 1. 马赛克网格基础布局 */
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            grid-auto-rows: 200px;
            grid-gap: 20px;
            max-width: 1200px; margin: 0 auto;
        }
        
        /* 2. 单个画作单元格子 */
        .gallery-item {
            position: relative; 
            overflow: hidden; 
            border-radius: 4px;
            background-color: #050505;
        }
        .gallery-item:nth-child(3n+1) { grid-row: span 2; }
        .gallery-item:nth-child(4n+2) { grid-row: span 1.5; } 
        .gallery-item a { display: block; width: 100%; height: 100%; }

        /* ======================================================== */
        /* 🎨 降采样黑魔法：双图层精准定位与平滑淡出技术 */
        /* ======================================================== */

        /* 👑 图层 A (在上层)：渲染纯净、不重叠、无错位的巨大硬边像素网格 */
        .pixelated-layer {
            position: absolute;
            z-index: 2;
            top: 0; left: 0;
            opacity: 0.8; /* 默认轻微暗淡 */
            
            /* 强制浏览器使用最近邻硬边算法 */
            image-rendering: -moz-crisp-edges;
            image-rendering: -o-crisp-edges;
            image-rendering: -webkit-optimize-contrast;
            image-rendering: crisp-edges;
            image-rendering: pixelated;

            /* 🛠️ 尺寸欺骗法：强行把画布拉大到 10 倍（1000%） */
            width: 1000% !important;
            height: 1000% !important;
            object-fit: cover;
            
            /* 🛠️ 关键修复：将缩放的基准点死死锁在左上角，彻底防止大色块飞出格子 */
            transform-origin: top left !important;
            
            /* 默认未悬停：缩小 10 倍回到格子大小，并额外叠加 1.08 倍的整体放大膨胀感 */
            transform: scale(calc(0.1 * 1.08)); 
            
            transition: transform 0.5s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.5s ease;
            will-change: transform, opacity;
        }

        /* 👑 图层 B (在下层)：静静隐藏，保留你珍贵的 7.1MB 原始极致超清无损细节 */
        .hd-layer {
            position: absolute;
            z-index: 1;
            top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: cover;
            opacity: 0; /* 默认隐藏，等待马赛克褪去 */
            image-rendering: auto; /* 恢复最高质量平滑渲染 */
            
            /* 🛠️ 高清层从正中心平滑收缩 */
            transform-origin: center center;
            transform: scale(1.08); /* 默认同样处于 1.08 倍膨胀状态 */
            
            transition: transform 0.5s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.5s ease;
            will-change: transform, opacity;
        }

        /* ======================================================== */
        /* 🚀 鼠标悬停 (Hover) 的双层联动淡出收缩特效 */
        /* ======================================================== */
        
        /* 1. 当鼠标移上去时：两层图片立刻同步优雅收缩回 1.0 原尺寸 */
        .gallery-item:hover .pixelated-layer {
            opacity: 0; 
            /* 移除膨胀感，回归 0.1 基础缩放 */
            transform: scale(0.1); 
        }

        .gallery-item:hover .hd-layer {
            opacity: 1; 
            /* 从 1.08 倍优雅收缩回 1.0 的原始大小 */
            transform: scale(1.0); 
        }

        /* 覆盖在图片上的文本标题 */
        .item-overlay {
            position: absolute; bottom: 0; left: 0; right: 0; z-index: 3;
            padding: 20px; background: linear-gradient(transparent, rgba(0,0,0,0.8));
            opacity: 0; transition: opacity 0.4s; pointer-events: none;
        }
        .gallery-item:hover .item-overlay { opacity: 1; }
        .item-title { color: white; font-size: 14px; margin-bottom: 4px; }
    </style>
</head>
<body>

    <div class="gallery-grid">
        {% for painting in site.paintings %}
        <div class="gallery-item">
            <a href="{{ painting.url }}">
                <!-- 图层 A：马赛克外套层 -->
                <img src="{{ painting.image_high }}" class="pixelated-layer" alt="{{ painting.title }}">
                <!-- 图层 B：高清真身层 -->
                <img src="{{ painting.image_high }}" class="hd-layer" alt="{{ painting.title }}" loading="lazy">
                
                <div class="item-overlay">
                    <div class="item-title">{{ painting.title }}</div>
                </div>
            </a>
        </div>
        {% endfor %}
    </div>

</body>
</html>
