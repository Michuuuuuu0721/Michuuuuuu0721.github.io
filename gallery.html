---
title: Gallery
layout: null
permalink: /gallery/
---
<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery</title>
    <style>
        body {
            margin: 0; padding: 40px 20px;
            background-color: black; font-family: sans-serif;
        }
        
        /* 1. 马赛克瀑布流网格基础布局 */
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            grid-auto-rows: 200px;
            grid-gap: 20px;
            max-width: 1200px; margin: 0 auto;
        }
        
        /* 2. 单个画作单元格子 */
        .gallery-item {
            position: relative; 
            overflow: hidden; 
            border-radius: 4px;
            background-color: #050505;
        }
        .gallery-item:nth-child(3n+1) { grid-row: span 2; }
        .gallery-item:nth-child(4n+2) { grid-row: span 1.5; } 
        .gallery-item a { display: block; width: 100%; height: 100%; }

        /* ======================================================== */
        /* 🎨 终极突破：背景图物理降采样与双图层平滑淡出技术 */
        /* ======================================================== */
        
        /* 共有层基础样式 */
        .img-layer {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-position: center center !important;
            background-repeat: no-repeat !important;
            
            /* 💡 默认状态下：两层图片都处于你喜欢的 1.08 倍膨胀状态 */
            transform: scale(1.08); 
            transition: transform 0.5s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.5s ease;
            will-change: transform, opacity;
        }

        /* 👑 图层 A (在上层)：渲染纯净、四四方方的规整马赛克大色块网格 */
        .pixelated-layer {
            z-index: 2;
            opacity: 0.8; /* 默认轻微暗淡，更具神秘感 */
            
            /* 🛠️ 核心：无视图片原本几千万像素，直接用物理尺寸强行覆盖填充 */
            background-size: cover !important; 

            /* 🛠️ 像素化核心：最近邻硬边算法（对显卡零压力） */
            image-rendering: -moz-crisp-edges;
            image-rendering: -o-crisp-edges;
            image-rendering: -webkit-optimize-contrast;
            image-rendering: crisp-edges;
            image-rendering: pixelated; 

            /* 💡 降采样黑魔法：故意只读取极低的分辨率作为平铺基准（宽度 16 像素，高度 12 像素）。
               这会逼迫浏览器把你的大图就地蹂碎、强制混合成数量极少、四四方方、完美对其的硬边网格大方块！ */
            background-size: 16px 12px !important; 
        }

        /* 👑 图层 B (在下层)：静静隐藏，完美保留你 7.1MB 原始极致超清无损细节 */
        .hd-layer {
            z-index: 1;
            opacity: 0; /* 默认隐藏，等待马赛克褪去 */
            background-size: cover !important; /* 恢复原比例高清填充 */
            image-rendering: auto; /* 恢复最高质量平滑渲染 */
        }

        /* ======================================================== */
        /* 🚀 鼠标悬停 (Hover) 的双层联动淡出收缩特效 */
        /* ======================================================== */
        
        /* 1. 当鼠标移上去时：两层图片立刻同步向内优雅收缩回 1.0 尺寸，形成拉远视角的聚焦感 */
        .gallery-item:hover .img-layer {
            transform: scale(1.0); 
        }

        /* 2. 核心：上层的巨型马赛克色块在 0.5 秒内慢慢变透明，丝滑淡出融化 */
        .gallery-item:hover .pixelated-layer {
            opacity: 0; 
        }

        /* 3. 核心：下层的 7.1MB 原始超清原画同步平滑淡入，完全浮现 */
        .gallery-item:hover .hd-layer {
            opacity: 1; 
        }

        /* 覆盖在图片上的文本标题 */
        .item-overlay {
            position: absolute; bottom: 0; left: 0; right: 0; z-index: 3;
            padding: 20px; background: linear-gradient(transparent, rgba(0,0,0,0.8));
            opacity: 0; transition: opacity 0.4s; pointer-events: none;
        }
        .gallery-item:hover .item-overlay { opacity: 1; }
        .item-title { color: white; font-size: 14px; margin-bottom: 4px; }
    </style>
</head>
<body>

    <div class="gallery-grid">
        {% for painting in site.paintings %}
        <div class="gallery-item">
            <a href="{{ painting.url }}">
                
                <!-- 👑 图层 A：马赛克外套层（利用背景缩放图技术，强行捏碎画面） -->
                <div class="img-layer pixelated-layer" style="background-image: url('{{ painting.image_high }}');"></div>
                
                <!-- 👑 图层 B：高清真身层（用户碰触时平滑淡入呈现） -->
                <div class="img-layer hd-layer" style="background-image: url('{{ painting.image_high }}');"></div>
                
                <div class="item-overlay">
                    <div class="item-title">{{ painting.title }}</div>
                </div>
            </a>
        </div>
        {% endfor %}
    </div>

</body>
</html>
