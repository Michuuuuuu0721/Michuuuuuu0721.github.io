<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <!-- A landscape game: no page zoom (iOS additionally needs the gesture handling of js/ui/device.js), full-bleed behind
       notches (viewport-fit=cover; css/devices.css keeps the HUD inside the safe area). -->
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0c0f0e" />
  <meta name="color-scheme" content="dark" />
  <meta name="format-detection" content="telephone=no" />
  <!-- "Add to Home Screen" (iOS / Android) opens full screen without browser bars -->
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="卫戍协议" />
  <meta name="description" content="卫戍协议：盟约  网页联机复刻（非官方同人作品）" />
  <title>卫戍协议：盟约  单机离线版</title>
  
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icons/favicon.ico" sizes="16x16 32x32 48x48" />
  <link rel="icon" href="icons/favicon-16.png" type="image/png" sizes="16x16" />
  <link rel="icon" href="icons/favicon-32.png" type="image/png" sizes="32x32" />
  <link rel="icon" href="icons/app.svg" type="image/svg+xml" sizes="any" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" sizes="180x180" />

  <!-- Web fonts: never render-blocking (LAN/offline play must still start); system fallbacks in theme.css. -->
  <link rel="preconnect" href="https://googleapis.com" />
  <link rel="preconnect" href="https://gstatic.com" crossorigin />
  <link rel="stylesheet" media="print" onload="this.media='all'"
        href="https://googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&family=Oxanium:wght@400;500;600;700&family=Rajdhani:wght@500;600;700&display=swap" />
  <!-- Self-hosted Bender / Novecento (provided by the assets pipeline). -->
  <link rel="stylesheet" href="fonts/fonts.css" />

  <link rel="stylesheet" href="css/theme.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/screens/title.css" />
  <link rel="stylesheet" href="css/screens/lobby.css" />
  <link rel="stylesheet" href="css/screens/room.css" />
  <link rel="stylesheet" href="css/screens/game.css" />
  <link rel="stylesheet" href="css/screens/game-shop.css" />
  <link rel="stylesheet" href="css/screens/game-panels.css" />
  <link rel="stylesheet" href="css/screens/briefing.css" />
  <link rel="stylesheet" href="css/screens/draft.css" />
  <link rel="stylesheet" href="css/screens/result.css" />
  <link rel="stylesheet" href="css/screens/guide.css" />
  <link rel="stylesheet" href="css/screens/loadout.css" />
  <link rel="stylesheet" href="css/screens/stats.css" />
  <link rel="stylesheet" href="css/emotes.css" />
  <link rel="stylesheet" href="css/devices.css" />

  <!-- 💡 核心修复：显式映射映射厂商库和 shared 静态数据文件夹，阻止其漂移到全局根目录 -->
  <script type="importmap">
    { 
      "imports": { 
        "preact": "./vendor/preact.module.js", 
        "preact/hooks": "./vendor/hooks.module.js", 
        "htm": "./vendor/htm.module.js",
        "shared/": "./shared/"
      } 
    }
  </script>
  
  <link rel="modulepreload" href="vendor/preact.module.js" />
  <link rel="modulepreload" href="vendor/hooks.module.js" />
  <link rel="modulepreload" href="vendor/htm.module.js" />
  <link rel="modulepreload" href="js/main.js" />
  
  <!-- Battlefield renderer libs -->
  <link rel="prefetch" href="vendor/pixi.min.js" as="script" />
  <link rel="prefetch" href="vendor/pixi-spine.js" as="script" />

  <!-- 💡 核心拦截芯片（已清洗 HTML 嵌套污染） -->
  <script>
      console.log("【守护者协议】静态沙盒虚拟服务器已在线启动。");

      // 1. 强行重写浏览器的原生 WebSocket，假装连接成功
      window.WebSocket = function(url) {
          console.log("拦截到游戏联机握手请求:", url);
          
          const mockSocket = {
              readyState: 1, // 1 代表 OPEN
              send: function(messageData) {
                  const msg = JSON.parse(messageData);
                  console.log("【前端发来指令】", msg.type, msg);
                  
                  // 2. 本地虚拟响应逻辑状态机
                  if (msg.type === 'MATCH_JOIN' || msg.type === 'ROOM_CREATE') {
                      setTimeout(() => {
                          mockSocket.onmessage({
                              data: JSON.stringify({
                                  type: 'ROOM_UPDATE',
                                  room: { id: "MOCK", host: "You", players: [{ name: "You", ready: true }], status: 'waiting' }
                              })
                          });
                      }, 200);
                  }
                  
                  if (msg.type === 'READY_TOGGLE') {
                      setTimeout(() => {
                          mockSocket.onmessage({
                              data: JSON.stringify({
                                  type: 'MATCH_START',
                                  round: 1,
                                  shop: { slots: [] }, 
                                  player: { gold: 6, exp: 0, level: 1, hp: 100 }
                              })
                          });
                      }, 500);
                  }
              },
              onopen: function() {},
              onmessage: function() {},
              onclose: function() {},
              onerror: function() {}
          };
          
          setTimeout(() => { if(mockSocket.onopen) mockSocket.onopen(); }, 50);
          return mockSocket;
      };

      // 2. 拦截本地静态探测请求
      const originalFetch = window.fetch;
      window.fetch = function(input, init) {
          if (typeof input === 'string' && input.includes('/healthz')) {
              return Promise.resolve(new Response(JSON.stringify({ status: "ok", mode: "offline-standalone" })));
          }
          return originalFetch(input, init);
      };
  </script>
</head>
<body>
  <div id="app"></div>

  <div id="boot" class="boot" aria-hidden="true">
    <div class="boot__inner">
      <div class="boot__hex"></div>
      <div class="boot__text">STRONGHOLD PROTOCOL</div>
      <div id="boot-err" class="boot__err"></div>
    </div>
  </div>

  <div class="rotate-hint" role="alert">
    <div class="rotate-hint__phone"></div>
    <div class="rotate-hint__title">请将设备横屏</div>
    <div>卫戍协议：盟约 需要横屏显示以获得完整体验</div>
    <button type="button" hidden class="btn btn--secondary btn--sm rotate-hint__pwa" id="rotate-hint-pwa">添加到桌面</button>
    <div class="rotate-hint__micro">ROTATE DEVICE</div>
  </div>

  <noscript><p style="color:#c3cbc7;text-align:center;padding:40px">需要启用 JavaScript 才能运行本游戏。</p></noscript>
  
  <script>
    // Boot diagnostics 
    window.__spBootFail = function (why) {
      var e = document.getElementById('boot-err');
      if (!e || e.getAttribute('data-final')) return;
      var im = false;
      try { im = !!(window.HTMLScriptElement && HTMLScriptElement.supports && HTMLScriptElement.supports('importmap')); } catch (x) { im = false; }
      e.textContent = why === 'old' || !im
        ? '当前浏览器版本过旧，无法运行本游戏。请升级到 iOS / iPadOS 16.4+（Safari 16.4+）、Chrome / Edge 90+ 或 Firefox 108+ 后刷新。'
        : '游戏脚本加载失败，请检查网络连接后刷新页面。';
      e.setAttribute('data-final', '1');
    };

    window.addEventListener('error', function (ev) {
      var b = document.getElementById('boot');
      if (!b || b.classList.contains('is-done')) return;
      if (/specifier|resolve|import|module/i.test(String(ev && ev.message))) window.__spBootFail('load');
    });
  </script>
  
  <!-- 核心程序入口加载 -->
  <script type="module" src="js/main.js" onerror="window.__spBootFail && window.__spBootFail('load')"></script>
  <script nomodule>window.__spBootFail && window.__spBootFail('old');</script>
  <script>
    setTimeout(function () {
      var b = document.getElementById('boot'), e = document.getElementById('boot-err');
      if (b && !b.classList.contains('is-done') && e && !e.textContent) e.textContent = '加载时间较长或无响应，请使用最新版 Chrome / Edge / Safari / Firefox 并刷新页面。';
    }, 9000);
  </script>
</body>
</html>
